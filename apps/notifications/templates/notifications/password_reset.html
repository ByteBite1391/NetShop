<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body style="font-family: Arial, sans-serif; color: #222; max-width: 600px; margin: auto;">
  <h2 style="color: #0d6efd;">Reset your password, {{ first_name }}</h2>
  <p>We received a request to reset your NexCart password.</p>
  <p style="margin: 24px 0;">
    <a href="https://nexcart.example/reset-password?token={{ token }}"
       style="background:#0d6efd;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;">
       Reset password
    </a>
  </p>
  <p style="font-size: 12px; color: #888;">If you didn't request this, you can safely ignore this email.</p>
</body>
</html>
