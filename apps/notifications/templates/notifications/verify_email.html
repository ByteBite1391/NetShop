<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Verify your email</title></head>
<body style="font-family: Arial, sans-serif; color: #222; max-width: 600px; margin: auto;">
  <h2 style="color: #0d6efd;">Verify your email, {{ first_name }}</h2>
  <p>Please confirm your email address to complete your NexCart registration.</p>
  <p style="margin: 24px 0;">
    <a href="https://nexcart.example/verify-email?token={{ token }}"
       style="background:#0d6efd;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;">
       Verify my email
    </a>
  </p>
  <p style="font-size: 12px; color: #888;">If you didn't create an account, you can ignore this email.</p>
</body>
</html>
