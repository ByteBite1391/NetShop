# NexCart Nginx — reverse proxy in front of Gunicorn.
#
# Responsibilities:
#   - Terminate TLS (enable by mounting certs + uncommenting the 443 server)
#   - Serve collected static files directly (bypassing Gunicorn)
#   - Proxy API + admin traffic to the `web` service
#   - Apply sane timeouts and headers

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;  # allow image uploads

    upstream nexcart_web {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Static + media served directly by Nginx (Gunicorn never touches them).
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /usr/share/nginx/media/;
            expires 1d;
        }

        # Everything else -> Gunicorn.
        location / {
            proxy_pass http://nexcart_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 120s;
        }
    }

    # Uncomment after provisioning TLS certificates.
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     # ... same location blocks as above ...
    # }
}
